
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wise Blue Heart</title>

<style>
body {
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.heart {
    width: 220px;
    height: 220px;
    animation: pulse 1.2s infinite ease-in-out;
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(0.9);
        filter: drop-shadow(0 0 8px #008cff);
    }
    50% {
        transform: scale(1.12);
        filter:
          drop-shadow(0 0 15px #008cff)
          drop-shadow(0 0 35px #0066ff)
          drop-shadow(0 0 65px #00aaff);
    }
}
</style>
</head>

<body>

<div class="heart">
<svg viewBox="0 0 200 200">
<defs>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00eaff"/>
<stop offset="50%" stop-color="#007bff"/>
<stop offset="100%" stop-color="#001eff"/>
</linearGradient>
</defs>

<path fill="url(#blue)"
d="M100 180
C80 155 10 105 10 60
C10 15 65 0 100 45
C135 0 190 15 190 60
C190 105 120 155 100 180Z"/>
</svg>
</div>

</body>
</html>
